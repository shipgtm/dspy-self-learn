[project]
name = "dspy-self-learn"
version = "0.1.0"
description = "Self-improving email generation with DSPy, GEPA, Jev and Vercel Workflows"
readme = "README.md"
authors = [
    { name = "Cameron Youngblood", email = "cameron.youngblood@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "ai[vercel]>=0.8.0",
    "dspy>=3.4.1",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "vercel>=0.12.1",
    "vercel-workflow>=0.12.0",
]

[tool.uv]
package = false

[[tool.vercel.workflows]]
entrypoint = "app.workflows:wf"
